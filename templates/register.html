{% extends "base.html" %}

{% block title %}Register | Personal Finance Advisor Bot{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 26px;">
        <i class="ri-user-add-line"></i>
      </div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Start tracking your cash flow and financial health</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Morgan" value="{{ name or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 6 chars)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        <i class="ri-user-add-line"></i> Register Account
      </button>
    </form>

    <div class="auth-divider">or</div>

    <a href="{{ url_for('auth.demo_login') }}" class="btn btn-outline" style="width: 100%;">
      <i class="ri-flashlight-line"></i> Try Demo Account Instead
    </a>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

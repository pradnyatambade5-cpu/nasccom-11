{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align: center;">
    <div style="font-size: 4rem; color: #6366f1; margin-bottom: 12px; font-weight: 800; font-family: var(--font-heading);">
      404
    </div>
    <h2 class="auth-title">Page Not Found</h2>
    <p class="auth-subtitle" style="margin-bottom: 24px;">
      The financial record or page you requested does not exist or has been relocated.
    </p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.landing') }}" class="btn btn-primary">
      <i class="ri-home-line"></i> Return to Safety
    </a>
  </div>
</div>
{% endblock %}
